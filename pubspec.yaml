name: smart_university_app
description: "A smart university app with attendance, timetable, assignments, events, cafeteria, announcements and AI chatbot."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  google_fonts: ^6.1.0
  lottie: ^2.4.0
  intl: ^0.19.0
  animations: ^2.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_linter: ^3.0.0

flu​tter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/gifs/

  fonts:
    - family: CustomFont
      fonts:
        - asset: assets/fonts/custom_font.ttf
